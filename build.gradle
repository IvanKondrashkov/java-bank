plugins {
    id 'java'
    id 'jacoco'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.boot' version '3.4.2' apply false
    id 'org.springframework.cloud.contract' version '4.3.0' apply false
}

allprojects {
    group = 'ru.practicum'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    tasks.withType(JavaCompile).tap {
        configureEach {
            options.encoding = 'UTF-8'
        }
    }

    apply plugin: "io.spring.dependency-management"
    dependencyManagement {
        dependencies {
            imports {
                mavenBom("org.springframework.boot:spring-boot-dependencies:$Versions.springBom")
                mavenBom("org.springframework.cloud:spring-cloud-dependencies:$Versions.cloudBom")
                mavenBom("org.springframework.cloud:spring-cloud-contract-dependencies:$Versions.cloudContractBom")
            }
            dependency("org.mapstruct:mapstruct:${Versions.mapstruct}")
            dependency("org.mapstruct:mapstruct-processor:${Versions.mapstruct}")
            dependency("org.projectlombok:lombok-mapstruct-binding:${Versions.lombokMapstructBinding}")
        }
    }
}

task managedVersions {
    doLast {
        dependencyManagement.managedVersions.each {
            println it
        }
    }
}