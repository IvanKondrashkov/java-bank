# Alert rules for Bank microservices (threshold breaches)
groups:
  - name: bank-alerts
    interval: 30s
    rules:
      - alert: High5xxRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (application) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate on {{ $labels.application }}"
          description: "5xx rate is above 0.1/s for 2m on {{ $labels.application }}."
      - alert: HighWithdrawalFailures
        expr: sum(rate(bank_withdrawal_failures_total[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High withdrawal failure rate"
          description: "Withdrawal failures rate is above 0.5/s for 2m."
      - alert: HighTransferFailures
        expr: sum(rate(bank_transfer_failures_total[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High transfer failure rate"
          description: "Transfer failures rate is above 0.5/s for 2m."
      - alert: HighNotificationSendFailures
        expr: sum(rate(bank_notification_send_failures_total[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High notification send failure rate"
          description: "Notification send failures rate is above 0.5/s for 2m."