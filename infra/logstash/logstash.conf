# Logstash pipeline: Beats input -> optional filter -> Elasticsearch output
input {
  beats {
    port => 5044
  }
}

filter {
  # Parse JSON so message.traceId, message.service etc. are queryable in Kibana
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "message"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "bank-logs-%{+YYYY.MM.dd}"
  }
}