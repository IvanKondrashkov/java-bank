# Java Bank - Docker Compose Configuration
# Микросервисное банковское приложение на Spring Boot

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bank-postgres
    environment:
      POSTGRES_DB: bank_db
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bank-network

  # Apache Kafka (KRaft, 2 брокера)
  x-kafka-common: &kafka-common
    image: bitnami/kafka:3.7
    environment: &kafka-common-env
      KAFKA_ENABLE_KRAFT: "yes"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093,1@kafka-1:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bank-network

  kafka-0:
    <<: *kafka-common
    container_name: bank-kafka-0
    restart: always
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-0:9092,EXTERNAL://127.0.0.1:9094
    volumes:
      - kafka_0_data:/bitnami/kafka

  kafka-1:
    <<: *kafka-common
    container_name: bank-kafka-1
    restart: always
    ports:
      - "127.0.0.1:9095:9095"
    environment:
      <<: *kafka-common-env
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://127.0.0.1:9095
    volumes:
      - kafka_1_data:/bitnami/kafka

  # Kafka UI — веб-интерфейс для просмотра топиков и сообщений
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.0
    container_name: bank-kafka-ui
    restart: always
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bank
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka-0:9092,kafka-1:9092
    networks:
      - bank-network
    depends_on:
      - kafka-0
      - kafka-1

  # Eureka Server - Service Discovery
  eureka-server:
    build:
      context: ..
      dockerfile: eureka-server/Dockerfile
    container_name: bank-eureka-server
    ports:
      - "8761:8761" # Eureka Dashboard
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Config Server - Externalized Configuration
  config-server:
    build:
      context: ..
      dockerfile: config-server/Dockerfile
    container_name: bank-config-server
    ports:
      - "8888:8888" # Config Server API
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka-0:
        condition: service_started
    networks:
      - bank-network
    environment:
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - KAFKA_BOOTSTRAP_SERVERS=kafka-0:9092,kafka-1:9092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Keycloak - OAuth 2.0 Authorization Server
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: bank-keycloak
    ports:
      - "8080:8080" # Keycloak Admin Console
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=keycloak
      - KC_HOSTNAME_PORT=8080
      - KC_HOSTNAME_STRICT=false
      - KC_SPI_IMPORT_DIR_STRATEGY=OVERWRITE_EXISTING
    command: start-dev --import-realm
    volumes:
      - ./keycloak/bank-realm.json:/opt/keycloak/data/import/bank-realm.json
    networks:
      - bank-network

  # Account Service - Управление банковскими счетами
  account-service:
    build:
      context: ..
      dockerfile: account-service/Dockerfile
    container_name: bank-account-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka-0:
        condition: service_started
    networks:
      - bank-network
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=bank_db
      - POSTGRES_USER=bank_user
      - POSTGRES_PASSWORD=bank_password
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka-0:9092,kafka-1:9092

  # Transfer Service - Переводы между счетами
  transfer-service:
    build:
      context: ..
      dockerfile: transfer-service/Dockerfile
    container_name: bank-transfer-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka-0:
        condition: service_started
    networks:
      - bank-network
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=bank_db
      - POSTGRES_USER=bank_user
      - POSTGRES_PASSWORD=bank_password
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka-0:9092,kafka-1:9092

  # Cash Service - Операции с наличными
  cash-service:
    build:
      context: ..
      dockerfile: cash-service/Dockerfile
    container_name: bank-cash-service
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka-0:
        condition: service_started
    networks:
      - bank-network
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=bank_db
      - POSTGRES_USER=bank_user
      - POSTGRES_PASSWORD=bank_password
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka-0:9092,kafka-1:9092

  # Notifications Service - Отправка уведомлений
  notifications-service:
    build:
      context: ..
      dockerfile: notifications-service/Dockerfile
    container_name: bank-notifications-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka-0:
        condition: service_started
    networks:
      - bank-network
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=bank_db
      - POSTGRES_USER=bank_user
      - POSTGRES_PASSWORD=bank_password
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka-0:9092,kafka-1:9092

  # Gateway Service - API Gateway
  gateway-service:
    build:
      context: ..
      dockerfile: gateway-service/Dockerfile
    container_name: bank-gateway-service
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started
      account-service:
        condition: service_started
      transfer-service:
        condition: service_started
      cash-service:
        condition: service_started
      notifications-service:
        condition: service_started
      kafka-0:
        condition: service_started
    networks:
      - bank-network
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka-0:9092,kafka-1:9092

  # Front Service - Front UI сервис
  # Браузер редиректится на Keycloak; с хоста доступ на 8080.
  front-service:
    build:
      context: ..
      dockerfile: front-service/Dockerfile
    container_name: bank-front-service
    ports:
      - "8090:8090"
    depends_on:
      config-server:
        condition: service_healthy
      gateway-service:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - bank-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - GATEWAY_HOST=gateway-service
      - GATEWAY_PORT=8081
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka-0:9092,kafka-1:9092

networks:
  bank-network:
    driver: bridge

volumes:
  postgres_data:
  kafka_0_data:
  kafka_1_data: