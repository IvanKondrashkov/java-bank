apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "elasticsearch.fullname" . }}-test-connection"
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget', '-q', '-O-', '-T', '3']
      args: ['http://{{ include "elasticsearch.fullname" . }}:{{ .Values.service.port }}/_cluster/health']
  restartPolicy: Never