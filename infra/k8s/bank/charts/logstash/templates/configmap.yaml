apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logstash.fullname" . }}-pipeline
  labels:
    {{- include "logstash.labels" . | nindent 4 }}
data:
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }
    filter {
      if [message] =~ /^\{.*\}$/ {
        json {
          source => "message"
          target => "message"
        }
      }
    }
    output {
      elasticsearch {
        hosts => ["{{ .Release.Name }}-elasticsearch:9200"]
        index => "bank-logs-%{+YYYY.MM.dd}"
      }
    }