apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "filebeat.fullname" . }}-config
  labels:
    {{- include "filebeat.labels" . | nindent 4 }}
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: container
        paths:
          - /var/log/containers/*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
    output.logstash:
      hosts: ["{{ .Release.Name }}-logstash:5044"]
    setup.ilm.enabled: false
    setup.template.enabled: false