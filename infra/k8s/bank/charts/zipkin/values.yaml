replicaCount: 1

image:
  repository: openzipkin/zipkin
  tag: "3.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false

service:
  type: ClusterIP
  port: 9411

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: zipkin.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

resources:
  requests: { memory: 256Mi, cpu: 100m }
  limits: { memory: 512Mi, cpu: 500m }