apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kibana.fullname" . }}-test-connection"
  labels:
    {{- include "kibana.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget', '-q', '-O-', '-T', '3']
      args: ['http://{{ include "kibana.fullname" . }}:{{ .Values.service.port }}/api/status']
  restartPolicy: Never