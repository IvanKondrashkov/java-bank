replicaCount: 1

image:
  repository: grafana/grafana
  tag: "11.2.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false

service:
  type: ClusterIP
  port: 3000

adminUser: admin
adminPassword: admin

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: grafana.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

resources:
  requests: { memory: 128Mi, cpu: 50m }
  limits: { memory: 256Mi, cpu: 200m }