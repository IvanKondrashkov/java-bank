apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-dashboards
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  bank-metrics.json: |
{{ .Files.Get "dashboards/bank-metrics.json" | nindent 4 }}
  spring-boot.json: |
{{ .Files.Get "dashboards/spring-boot.json" | nindent 4 }}