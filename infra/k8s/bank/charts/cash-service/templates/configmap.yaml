apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cash-service.fullname" . }}-config
  labels:
    {{- include "cash-service.labels" . | nindent 4 }}
data:
  application.yml: |
    server:
      port: {{ .Values.service.port }}
    spring:
      application:
        name: cash-service
      cloud:
        config:
          enabled: false
        discovery:
          enabled: false
        eureka:
          client:
            enabled: false
        openfeign:
          client:
            config:
              account-service:
                url: http://account-service:8082
      datasource:
        url: jdbc:postgresql://{{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.auth.database }}
        username: {{ .Values.postgresql.auth.username }}
        password: ${POSTGRES_PASSWORD}
        driver-class-name: org.postgresql.Driver
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            default_schema: {{ .Values.config.database.schema }}
      liquibase:
        change-log: classpath:db/liquibase-changelog.xml
        clear-checksums: true
      security:
        oauth2:
          client:
            registration:
              cash-service:
                client-id: {{ .Values.config.oauth.clientId }}
                client-secret: ${OAUTH_CLIENT_SECRET}
                authorization-grant-type: client_credentials
                provider: keycloak
            provider:
              keycloak:
                issuer-uri: http://{{ .Values.global.baseKeycloakHost }}/realms/bank
          resourceserver:
            jwt:
              issuer-uri: http://{{ .Values.global.baseKeycloakHost }}/realms/bank
      kafka:
        bootstrap-servers: {{ .Values.global.kafkaBootstrapServers }}
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
          acks: all
    bank:
      notifications:
        kafka:
          topic: bank.notifications
          dlt-topic: bank.notifications.dlt
    management:
      tracing:
        sampling:
          probability: 1.0
      zipkin:
        tracing:
          endpoint: {{ .Values.global.zipkinEndpoint | default "http://bank-zipkin:9411/api/v2/spans" }}
      endpoints:
        web:
          exposure:
            include: health, info, metrics, prometheus
      endpoint:
        health:
          access: read-only
      metrics:
        tags:
          application: cash-service