# Release "bank" → services: bank-postgresql, bank-keycloak-db, bank-keycloak, bank-kafka, bank-*-service.
# Jenkins overrides: postgresql.auth.password, keycloak.auth.adminPassword, *-service.image.*, ingress hosts.
global:
  domain: bank.local
  baseKeycloakHost: auth.local
  zipkinEndpoint: "http://bank-zipkin:9411/api/v2/spans"

# Configuration for the account-service subchart
# NOTE: Build image locally: `docker build -t account-service:0.0.1-SNAPSHOT .` in account-service dir
account-service:
  fullnameOverride: account-service
  replicaCount: 1
  waitForKeycloak: true
  image:
    repository: account-service # Removed registry prefix
    tag: "0.0.1-SNAPSHOT"
    pullPolicy: IfNotPresent # Use IfNotPresent for local images
  service:
    type: ClusterIP
    port: 8082
  ingress:
    enabled: false
    className: "nginx" # Specify your ingress controller class
    hosts:
      - host: account.test.local # Use global domain or specific
        paths:
          - path: /
            pathType: ImplementationSpecific
  config:
    database:
      schema: svc_accounts
    oauth:
      clientId: account-service-client
      clientSecret: account-service-secret

