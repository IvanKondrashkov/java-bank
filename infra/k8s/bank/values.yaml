# Configuration for Keycloak (Bitnami chart). Uses external DB keycloak-db (no nested postgresql).
keycloak:
  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak
  postgresql:
    enabled: false
  externalDatabase:
    host: bank-keycloak-db
    port: 5432
    database: bitnami_keycloak
    user: bn_keycloak
    existingSecret: bank-keycloak-db
    existingSecretPasswordKey: password
  auth:
    adminUser: admin
    adminPassword: admin  # Overridden by Jenkins via --set keycloak.auth.adminPassword
  ingress:
    enabled: true
    hostname: auth.local
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
  proxyAddressForwarding: true
  httpEnabled: true
  extraStartupArgs: "--features=hostname:v2"
  extraEnvVars:
    - name: KC_HOSTNAME
      value: "http://auth.local"
    - name: KC_HOSTNAME_STRICT_HTTPS
      value: "false"
    - name: KC_HTTP_ENABLED
      value: "true"
  keycloakConfigCli:
    enabled: true
    existingConfigmap: bank-keycloak-realm
    image:
      registry: docker.io
      repository: bitnamilegacy/keycloak-config-cli
    availabilityCheck:
      enabled: true
    extraEnvVars:
      - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
        value: "300s"
      - name: KEYCLOAK_AVAILABILITYCHECK_RETRYDELAY
        value: "5s"
    backoffLimit: 30
  startupProbe:
    enabled: true
    failureThreshold: 60
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 120
    periodSeconds: 10
  resources:
    requests: { memory: 768Mi, cpu: 250m }
    limits: { memory: 1536Mi, cpu: 1000m }

# Configuration for PostgreSQL (Bitnami chart)
postgresql:
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
  auth:
    username: bank_user
    password: bank_password
    database: bank_db
  primary:
    persistence:
      size: 1Gi
    startupProbe:
      enabled: true
      failureThreshold: 30
    readinessProbe:
      initialDelaySeconds: 60
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits: { memory: 512Mi, cpu: 500m }

# Configuration for PostgreSQL Keycloak DB (Bitnami chart)
keycloak-db:
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
  auth:
    username: bn_keycloak
    password: keycloak_db_password
    database: bitnami_keycloak
  primary:
    persistence:
      size: 1Gi
    startupProbe:
      enabled: true
      failureThreshold: 30
    readinessProbe:
      initialDelaySeconds: 60
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits: { memory: 512Mi, cpu: 500m }

# Configuration for Kafka (Bitnami chart): 2 brokers, KRaft, PLAINTEXT, persistence
kafka:
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
  controller:
    replicaCount: 2
    persistence:
      enabled: true
      size: 1Gi
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
  overrideConfiguration:
    auto.create.topics.enable: "true"
  resources:
    requests: { memory: 512Mi, cpu: 250m }
    limits: { memory: 1Gi, cpu: 1000m }