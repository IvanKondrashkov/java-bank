# Конфигурация для Cash Service
server:
  port: 8084

spring:
  application:
    name: cash-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bank_db}
    username: ${POSTGRES_USER:bank_user}
    password: ${POSTGRES_PASSWORD:bank_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: svc_cash
  liquibase:
    change-log: classpath:db/liquibase-changelog.xml
    clear-checksums: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094,localhost:9095}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
  security:
    oauth2:
      client:
        registration:
          cash-service:
            client-id: cash-service-client
            client-secret: cash-service-secret
            authorization-grant-type: client_credentials
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/realms/bank
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/realms/bank

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: refresh, busrefresh, health, info
  endpoint:
    refresh:
      access: unrestricted
    busrefresh:
      access: unrestricted
    health:
      access: read-only

logging:
  level:
    ru.yandex.practicum.bank: INFO
    org.springframework.security: WARN