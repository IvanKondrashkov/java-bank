# Общие настройки для всех микросервисов
logging:
  level:
    root: INFO
    ru.yandex.practicum.bank: INFO

spring:
  application:
    name: bank-services

eureka:
  instance:
    # Use container/network IPs so other services can reach each instance.
    prefer-ip-address: true

# Уведомления через Kafka
bank:
  notifications:
    kafka:
      topic: bank.notifications
      dlt-topic: bank.notifications.dlt