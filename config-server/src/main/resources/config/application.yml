# Общие настройки для всех микросервисов
logging:
  level:
    root: INFO
    ru.yandex.practicum.bank: INFO

spring:
  application:
    name: bank-services

eureka:
  instance:
    # Use container/network IPs so other services can reach each instance.
    prefer-ip-address: true

# Уведомления через Kafka
bank:
  notifications:
    kafka:
      topic: bank.notifications
      dlt-topic: bank.notifications.dlt

# Observability: Zipkin tracing + Prometheus metrics (Docker Compose: config-server раздаёт эти настройки)
# Для Kubernetes значения задаются в ConfigMap каждого сервиса (global.zipkinEndpoint и т.д.)
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      access: read-only